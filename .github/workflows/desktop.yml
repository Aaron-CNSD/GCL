name: Desktop verification
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'scripts/*desktop*', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core compatibility tests
        shell: bash
        run: bash scripts/test-desktop.sh
      - name: Build launcher
        shell: bash
        run: bash scripts/build-desktop.sh "$GITHUB_WORKSPACE/artifacts/desktop"
      - name: Windows window smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: java -jar artifacts/desktop/GCL-0.3.0-Desktop.jar --smoke
      - name: Linux window smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a java -jar artifacts/desktop/GCL-0.3.0-Desktop.jar --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: GCL-${{ runner.os }}
          path: artifacts/desktop/*.jar
